services:
  postgres:
    image: postgres:16-alpine
    container_name: filetemp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-filetemp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-filetemp}
      POSTGRES_DB: ${POSTGRES_DB:-filetemp}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-filetemp} -d ${POSTGRES_DB:-filetemp}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: filetemp-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-filetemp}:${POSTGRES_PASSWORD:-filetemp}@postgres:5432/${POSTGRES_DB:-filetemp}?sslmode=disable
      HTTP_ADDR: :8080
      SWAGGER_HOST: ${SWAGGER_HOST:-localhost:8080}
      JWT_SECRET: ${JWT_SECRET:-change-me-jwt-secret}
      JWT_TTL: ${JWT_TTL:-24h}
      UPLOAD_DIR: /data/uploads
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:3000}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - upload_data:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    container_name: filetemp-web
    restart: unless-stopped
    environment:
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

  # --- Planned: MinIO (S3-compatible object storage) ---
  # minio:
  #   image: minio/minio:latest
  #   container_name: filetemp-minio
  #   command: server /data --console-address ":9001"
  #   environment:
  #     MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
  #     MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
  #   ports:
  #     - "9000:9000"
  #     - "9001:9001"
  #   volumes:
  #     - minio_data:/data

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: filetemp-rabbitmq
    restart: unless-stopped
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    container_name: filetemp-worker
    restart: unless-stopped
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      GMAIL_APP_LOGIN: ${GMAIL_APP_LOGIN}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD}
    depends_on:
      rabbitmq:
        condition: service_healthy

volumes:
  postgres_data:
  upload_data:
  rabbitmq_data:
  # minio_data:
