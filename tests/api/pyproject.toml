[project]
name = "file-temp-share-api-int"
version = "0.1.0"
description = "API integration tests for file-temp-share"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28.1",
  "psycopg[binary]>=3.2.6",
  "pytest>=8.3.5",
]

[tool.pytest.ini_options]
testpaths = ["."]
pythonpath = ["."]
addopts = ["-v"]
