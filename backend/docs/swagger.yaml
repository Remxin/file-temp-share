basePath: /
definitions:
  file-temp-share_backend_internal_dto.AuthResponse:
    properties:
      expires_at:
        type: string
      token:
        type: string
      user:
        $ref: '#/definitions/file-temp-share_backend_internal_dto.UserResponse'
    type: object
  file-temp-share_backend_internal_dto.CreateTransferRequest:
    properties:
      expires_in_hours:
        maximum: 720
        minimum: 1
        type: integer
      message:
        maxLength: 5000
        type: string
      password:
        maxLength: 72
        minLength: 4
        type: string
      recipients:
        items:
          type: string
        maxItems: 20
        type: array
      title:
        maxLength: 100
        type: string
    required:
    - expires_in_hours
    type: object
  file-temp-share_backend_internal_dto.FileResponse:
    properties:
      created_at:
        type: string
      id:
        type: string
      mime_type:
        type: string
      original_name:
        type: string
      size_bytes:
        type: integer
    type: object
  file-temp-share_backend_internal_dto.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  file-temp-share_backend_internal_dto.MessageResponse:
    properties:
      message:
        type: string
    type: object
  file-temp-share_backend_internal_dto.PasswordResetConfirmRequest:
    properties:
      new_password:
        maxLength: 72
        minLength: 8
        type: string
      token:
        type: string
    required:
    - new_password
    - token
    type: object
  file-temp-share_backend_internal_dto.PasswordResetRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  file-temp-share_backend_internal_dto.PublicTransferResponse:
    properties:
      expires_at:
        type: string
      file_count:
        type: integer
      files:
        items:
          $ref: '#/definitions/file-temp-share_backend_internal_dto.FileResponse'
        type: array
      has_password:
        type: boolean
      message:
        type: string
      sender_email:
        type: string
      short_code:
        type: string
      status:
        type: string
      title:
        type: string
      total_size_bytes:
        type: integer
      unlocked:
        type: boolean
    type: object
  file-temp-share_backend_internal_dto.RegisterRequest:
    properties:
      email:
        type: string
      password:
        maxLength: 72
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  file-temp-share_backend_internal_dto.TransferDetailResponse:
    properties:
      created_at:
        type: string
      download_count:
        type: integer
      expires_at:
        type: string
      file_count:
        type: integer
      files:
        items:
          $ref: '#/definitions/file-temp-share_backend_internal_dto.FileResponse'
        type: array
      has_password:
        type: boolean
      id:
        type: string
      message:
        type: string
      recipient_count:
        type: integer
      share_url:
        type: string
      short_code:
        type: string
      status:
        type: string
      title:
        type: string
      total_size_bytes:
        type: integer
    type: object
  file-temp-share_backend_internal_dto.TransferListItem:
    properties:
      created_at:
        type: string
      download_count:
        type: integer
      expires_at:
        type: string
      file_count:
        type: integer
      first_file_name:
        type: string
      has_password:
        type: boolean
      id:
        type: string
      message:
        type: string
      recipient_count:
        type: integer
      share_url:
        type: string
      short_code:
        type: string
      status:
        type: string
      title:
        type: string
      total_size_bytes:
        type: integer
    type: object
  file-temp-share_backend_internal_dto.TransferResponse:
    properties:
      created_at:
        type: string
      download_count:
        type: integer
      expires_at:
        type: string
      has_password:
        type: boolean
      id:
        type: string
      message:
        type: string
      share_url:
        type: string
      short_code:
        type: string
      status:
        type: string
      title:
        type: string
    type: object
  file-temp-share_backend_internal_dto.UnlockTransferRequest:
    properties:
      password:
        maxLength: 72
        minLength: 1
        type: string
    required:
    - password
    type: object
  file-temp-share_backend_internal_dto.UserResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      role:
        type: string
    type: object
  file-temp-share_backend_internal_platform_httpx.ErrorBody:
    properties:
      details:
        items:
          $ref: '#/definitions/file-temp-share_backend_internal_platform_httpx.FieldError'
        type: array
      error:
        type: string
      fields:
        additionalProperties:
          type: string
        type: object
    type: object
  file-temp-share_backend_internal_platform_httpx.FieldError:
    properties:
      field:
        type: string
      message:
        type: string
    type: object
info:
  contact:
    name: file-temp-share
    url: https://github.com/Remxin/file-temp-share
  description: Temporary file-sharing API (WeTransfer-like).
  title: file-temp-share API
  version: 0.1.0
paths:
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/file-temp-share_backend_internal_dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/file-temp-share_backend_internal_dto.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/file-temp-share_backend_internal_platform_httpx.ErrorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/file-temp-share_backend_internal_platform_httpx.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/file-temp-share_backend_internal_platform_httpx.ErrorBody'
      summary: Login
      tags:
      - auth
  /api/v1/auth/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/file-temp-share_backend_internal_dto.UserResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/file-temp-share_backend_internal_platform_httpx.ErrorBody'
      security:
      - BearerAuth: []
      summary: Current user
      tags:
      - auth
  /api/v1/auth/password-reset:
    post:
      consumes:
      - application/json
      description: Always returns success. Email sending is not implemented yet; reset
        token is logged server-side for development.
      parameters:
      - description: email
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/file-temp-share_backend_internal_dto.PasswordResetRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/file-temp-share_backend_internal_dto.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/file-temp-share_backend_internal_platform_httpx.ErrorBody'
      summary: Request password reset
      tags:
      - auth
  /api/v1/auth/password-reset/confirm:
    post:
      consumes:
      - application/json
      parameters:
      - description: token and new password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/file-temp-share_backend_internal_dto.PasswordResetConfirmRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/file-temp-share_backend_internal_platform_httpx.ErrorBody'
      summary: Confirm password reset
      tags:
      - auth
  /api/v1/auth/register:
    post:
      consumes:
      - application/json
      parameters:
      - description: credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/file-temp-share_backend_internal_dto.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/file-temp-share_backend_internal_dto.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/file-temp-share_backend_internal_platform_httpx.ErrorBody'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/file-temp-share_backend_internal_platform_httpx.ErrorBody'
      summary: Register user
      tags:
      - auth
  /api/v1/public/transfers/{shortCode}:
    get:
      parameters:
      - description: short code
        in: path
        name: shortCode
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/file-temp-share_backend_internal_dto.PublicTransferResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/file-temp-share_backend_internal_platform_httpx.ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/file-temp-share_backend_internal_platform_httpx.ErrorBody'
      summary: Public transfer by short code
      tags:
      - public
  /api/v1/public/transfers/{shortCode}/files/{fileId}:
    get:
      parameters:
      - description: short code
        in: path
        name: shortCode
        required: true
        type: string
      - description: file id
        in: path
        name: fileId
        required: true
        type: string
      - description: transfer password when required
        in: header
        name: X-Transfer-Password
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: OK
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/file-temp-share_backend_internal_platform_httpx.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/file-temp-share_backend_internal_platform_httpx.ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/file-temp-share_backend_internal_platform_httpx.ErrorBody'
        "410":
          description: Gone
          schema:
            $ref: '#/definitions/file-temp-share_backend_internal_platform_httpx.ErrorBody'
      summary: Download public transfer file
      tags:
      - public
  /api/v1/public/transfers/{shortCode}/unlock:
    post:
      consumes:
      - application/json
      parameters:
      - description: short code
        in: path
        name: shortCode
        required: true
        type: string
      - description: password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/file-temp-share_backend_internal_dto.UnlockTransferRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/file-temp-share_backend_internal_dto.PublicTransferResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/file-temp-share_backend_internal_platform_httpx.ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/file-temp-share_backend_internal_platform_httpx.ErrorBody'
      summary: Unlock password-protected public transfer
      tags:
      - public
  /api/v1/transfers:
    get:
      parameters:
      - description: active|expired|all
        enum:
        - active
        - expired
        - all
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/file-temp-share_backend_internal_dto.TransferListItem'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/file-temp-share_backend_internal_platform_httpx.ErrorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/file-temp-share_backend_internal_platform_httpx.ErrorBody'
      security:
      - BearerAuth: []
      summary: List own transfers
      tags:
      - transfers
    post:
      consumes:
      - application/json
      parameters:
      - description: transfer metadata
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/file-temp-share_backend_internal_dto.CreateTransferRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/file-temp-share_backend_internal_dto.TransferResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/file-temp-share_backend_internal_platform_httpx.ErrorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/file-temp-share_backend_internal_platform_httpx.ErrorBody'
      security:
      - BearerAuth: []
      summary: Create transfer
      tags:
      - transfers
  /api/v1/transfers/{id}:
    get:
      parameters:
      - description: transfer id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/file-temp-share_backend_internal_dto.TransferDetailResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/file-temp-share_backend_internal_platform_httpx.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/file-temp-share_backend_internal_platform_httpx.ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/file-temp-share_backend_internal_platform_httpx.ErrorBody'
      security:
      - BearerAuth: []
      summary: Get own transfer detail
      tags:
      - transfers
  /api/v1/transfers/{id}/files:
    post:
      consumes:
      - multipart/form-data
      parameters:
      - description: transfer id
        in: path
        name: id
        required: true
        type: string
      - description: file
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/file-temp-share_backend_internal_dto.FileResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/file-temp-share_backend_internal_platform_httpx.ErrorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/file-temp-share_backend_internal_platform_httpx.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/file-temp-share_backend_internal_platform_httpx.ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/file-temp-share_backend_internal_platform_httpx.ErrorBody'
        "410":
          description: Gone
          schema:
            $ref: '#/definitions/file-temp-share_backend_internal_platform_httpx.ErrorBody'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/file-temp-share_backend_internal_platform_httpx.ErrorBody'
      security:
      - BearerAuth: []
      summary: Upload file to transfer
      tags:
      - transfers
  /api/v1/transfers/{id}/files/{fileId}:
    get:
      parameters:
      - description: transfer id
        in: path
        name: id
        required: true
        type: string
      - description: file id
        in: path
        name: fileId
        required: true
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: OK
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/file-temp-share_backend_internal_platform_httpx.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/file-temp-share_backend_internal_platform_httpx.ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/file-temp-share_backend_internal_platform_httpx.ErrorBody'
        "410":
          description: Gone
          schema:
            $ref: '#/definitions/file-temp-share_backend_internal_platform_httpx.ErrorBody'
      security:
      - BearerAuth: []
      summary: Download own transfer file
      tags:
      - transfers
  /health:
    get:
      description: Returns service liveness
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Health check
      tags:
      - system
securityDefinitions:
  BearerAuth:
    description: 'JWT token. Example: "Bearer {token}"'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
