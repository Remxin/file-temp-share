version: "3"

vars:
  N: "devbox run --"
  BACKEND_DIR: backend
  MIGRATIONS_DIR: backend/db/migrations
  BIN_DIR: bin
  MIGRATE_BIN: "{{.BIN_DIR}}/migrate"
  MIGRATE_PKG: github.com/golang-migrate/migrate/v4/cmd/migrate@v4.18.1
  DATABASE_URL:
    sh: 'echo "${DATABASE_URL:-postgres://filetemp:filetemp@localhost:5432/filetemp?sslmode=disable}"'

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  tools:install:
    desc: Install local CLI tools (golang-migrate with postgres driver only)
    cmds:
      - mkdir -p {{.BIN_DIR}}
      # Nix/Devbox go-migrate panics (Snowflake CA). Build postgres-only binary into ./bin.
      - '{{.N}} env GOBIN="{{.USER_WORKING_DIR}}/{{.BIN_DIR}}" go install -tags "postgres" {{.MIGRATE_PKG}}'
      - "{{.MIGRATE_BIN}} -version"

  infra:up:
    desc: Build and start Postgres, RabbitMQ, API, worker, and frontend
    cmds:
      - docker compose up -d --build

  infra:up:db:
    desc: Start only PostgreSQL (for local api/frontend via task)
    cmds:
      - docker compose up -d postgres

  infra:up:mq:
    desc: Start only RabbitMQ (AMQP :5672, management :15672)
    cmds:
      - docker compose up -d rabbitmq

  infra:up:minio:
    desc: Start MinIO + create transfers bucket (S3 :9000, console :9001)
    cmds:
      - docker compose up -d minio minio-init

  infra:down:
    desc: Stop Compose services
    cmds:
      - docker compose down

  infra:logs:
    desc: Tail Compose logs
    cmds:
      - docker compose logs -f

  infra:ps:
    desc: Show Compose service status
    cmds:
      - docker compose ps

  db:migrate:up:
    desc: Apply database migrations (golang-migrate)
    deps: [tools:install]
    cmds:
      - '{{.MIGRATE_BIN}} -path {{.MIGRATIONS_DIR}} -database "{{.DATABASE_URL}}" up'

  db:migrate:down:
    desc: Roll back one migration
    deps: [tools:install]
    cmds:
      - '{{.MIGRATE_BIN}} -path {{.MIGRATIONS_DIR}} -database "{{.DATABASE_URL}}" down 1'

  db:seed:
    desc: Load development seed data (users)
    cmds:
      - |
        docker compose exec -T postgres \
          psql -U "${POSTGRES_USER:-filetemp}" -d "${POSTGRES_DB:-filetemp}" \
          < backend/db/seeds/001_users.sql

  db:sqlc:
    desc: Generate Go code from SQL (sqlc)
    # devbox run resets cwd to repo root (devbox.json); cd explicitly inside the command.
    cmds:
      - '{{.N}} sh -c "cd {{.BACKEND_DIR}}/db && sqlc generate"'

  api:swagger:
    desc: Generate OpenAPI/Swagger docs (swag)
    cmds:
      - '{{.N}} sh -c "cd {{.BACKEND_DIR}} && go run github.com/swaggo/swag/cmd/swag@v1.16.4 init -g cmd/api/main.go -o docs --parseDependency --parseInternal"'

  api:run:
    desc: Run API locally (ensure task api:swagger was run once)
    cmds:
      - '{{.N}} sh -c "cd {{.BACKEND_DIR}} && go run ./cmd/api"'

  worker:run:
    desc: Run async worker (RabbitMQ + GMAIL_APP_LOGIN/PASSWORD in .env/.env.local)
    cmds:
      - '{{.N}} sh -c "cd {{.BACKEND_DIR}} && go run ./cmd/worker"'

  frontend:dev:
    desc: Run Next.js frontend (http://localhost:3000)
    cmds:
      - '{{.N}} sh -c "cd frontend && npm run dev"'

  frontend:build:
    desc: Build Next.js frontend for production
    cmds:
      - '{{.N}} sh -c "cd frontend && npm run build"'

  frontend:lint:
    desc: Lint Next.js frontend
    cmds:
      - '{{.N}} sh -c "cd frontend && npm run lint"'

  devbox:check:
    desc: Verify Devbox toolbox tool versions
    deps: [tools:install]
    cmds:
      - "{{.N}} go version"
      - "{{.N}} sqlc version"
      - "{{.MIGRATE_BIN}} -version"
      - "{{.N}} task --version"
      - "{{.N}} node --version"
